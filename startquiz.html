<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz app</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet"href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
<!-- home page start -->

<div class="container home d-flex justify-content-center align-items-center">

    <div class="card text-center bg-transparent border-0 p-4 quiz-card">

        <div class="card-body">

            <div class="quiz-icon mb-3">
                <i class="fa-solid fa-brain"></i>
            </div>

            <h2 class="card-title head">QUIZ MASTER</h2>

            <p class="card-text mt-3 text-dark">
                <em>Challenge yourself and test your knowledge!</em>
            </p>

            <p class="small-text">
                Learn • Think • Win
            </p>

            <a href="test.html" class="btn btn-primary mt-3 start-btn">
                Start Quiz
                <i class="fa-solid fa-arrow-right ms-2"></i>
            </a>

        </div>

    </div>

</div>



<!-- home page end -->


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</html>
